now services:
  - type: web
    name: scalerai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: gunicorn src.wsgi:app
    healthCheckPath: /status
    envVars:
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: FLASK_DEBUG
        value: "false"
